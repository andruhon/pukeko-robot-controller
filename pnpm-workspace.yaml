# pnpm config for this single-package repo. pnpm 11.3.0 reads settings from
# here, not from the "pnpm" field in package.json.

overrides:
  uuid: '>=11.1.1'
  # No @gaunt-sloth/* redirect needed: alpha.6 declares zod `^4.0.0` itself
  # (GS2-15 fix c), so pnpm no longer dedupes the gaunt-sloth subtree onto this
  # repo's zod 3.
  # GS2-43 gaunt-sloth file: overrides dropped once @gaunt-sloth/*@2.0.0-alpha.24
  # (the first release carrying the `prompts` config object) published — the
  # package.json pins below now resolve the `prompts` schema straight from npm.

  # Dependencies pnpm is allowed to run install/build scripts for. esbuild needs
  # its postinstall to fetch its native binary; without this pnpm skips it
  # (ERR_PNPM_IGNORED_BUILDS) and vite/vitest fail to start.
allowBuilds:
  esbuild: true

# These are packages we publish ourselves, so they are listed bare (OPS-115): a
# bare name matches every version, and nothing here needs a hand edit when one of
# our releases lands.
#
# ONE entry per package name. pnpm returns on the first rule whose name matches
# and never consults a later one, so a second entry for the same package is
# silently ignored and the exception it names is not in force — including the
# plain `name@version` line `pnpm install` appends for itself when it meets an
# immature package, which lands after these and is dead on arrival. Splitting a
# package's versions into a line per version looks tidier and switches the
# exception off with no error anywhere.
#
# This list is read on two paths, resolving a version and verifying the lockfile,
# and resolution is the dangerous one because it EXITS 0: against a version range,
# whenever no entry here covers the newest release, pnpm quietly resolves the
# older mature version instead and reports success. An ignored second entry is one
# way to arrive there; not listing the package at all is another.
#
# A bare entry already grants every version, so pnpm never has anything to append
# for our own packages: an appended line here is third-party by construction, and
# worth a look before it is kept.
minimumReleaseAgeExclude:
  - '@galvanized-pukeko/vue-ui'
  - '@gaunt-sloth/agent'
  - '@gaunt-sloth/core'
