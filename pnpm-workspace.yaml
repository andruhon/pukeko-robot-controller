# pnpm config for this single-package repo. pnpm 11.3.0 reads settings from
# here, not from the "pnpm" field in package.json.

overrides:
  uuid: '>=11.1.1'
  # No @gaunt-sloth/* redirect needed: alpha.6 declares zod `^4.0.0` itself
  # (GS2-15 fix c), so pnpm no longer dedupes the gaunt-sloth subtree onto this
  # repo's zod 3.
  # GS2-43 gaunt-sloth file: overrides dropped once @gaunt-sloth/*@2.0.0-alpha.24
  # (the first release carrying the `prompts` config object) published — the
  # package.json pins below now resolve the `prompts` schema straight from npm.

  # Dependencies pnpm is allowed to run install/build scripts for. esbuild needs
  # its postinstall to fetch its native binary; without this pnpm skips it
  # (ERR_PNPM_IGNORED_BUILDS) and vite/vitest fail to start.
allowBuilds:
  esbuild: true

# ONE entry per package name, versions joined with `||`. A second entry naming the
# same package is silently ignored: pnpm returns on the first rule whose name
# matches, so a later line for that package is never consulted and the version it
# names is still held back. Splitting these into a line per version looks tidier
# and switches the exception off without any error — on both paths, resolving a
# version and verifying the lockfile.
#
# The resolution no-op is the dangerous one, because it EXITS 0: `pnpm update`
# against a shadowed entry quietly leaves the old version in place and reports
# success. `pnpm install` also appends a plain `name@version` line of its own when
# it meets an immature package, which lands after these and is therefore dead on
# arrival. When a new release is pinned, fold its version into the entry for that
# package and delete any appended line.
minimumReleaseAgeExclude:
  - '@galvanized-pukeko/vue-ui@0.2.3||0.2.4'
  - '@gaunt-sloth/agent@2.0.0-beta.5'
  - '@gaunt-sloth/core@2.0.0-beta.5'
